version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: redis-cache
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    ports:
      - "127.0.0.1:6379:6379" # Vincula apenas ao localhost para segurança
    volumes:
      - redis_data:/data
    networks:
      - precogas-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: always

  api:
    build: .
    container_name: precogas-api
    ports:
      - "8000:8000"
    volumes:
      - ./dados_anp:/app/dados_anp
    networks:
      - precogas-net
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - API_ACCESS_TOKEN=${API_ACCESS_TOKEN}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

volumes:
  redis_data:

networks:
  precogas-net:
    driver: bridge
